# Corrected-contact-label rerun. Identical to the original config except:
#   * stat_dict_path -> *_norm_stats_fps.pkl (statistics of the corrected label)
#   * num_epochs cut, justified by the observed validation curves: the motion model's
#     validation loss bottomed at epoch 18 and rose 81% by 199, the contact model's at 74
#     and rose 13%, so 60 / 110 epochs pass both minima with margin.
#   * exp_name -> motion_model_taco_fps
# The store is passed on the command line (train_store_fps). Everything else -- batch 100,
# lr, architecture, dropout, EMA, diffusion steps -- is unchanged, so the only difference
# from the previous run is the contact label.
# TACO port of BimArt's motion model config. See the contact config for what changed and why.
inherit: null
exp_name: motion_model_taco_fps
save_root_dir: /result/uhnam/dexcore/bimart_taco/experiments/
use_job_id: true
data:
  base_dir: /result/uhnam/dexcore/bimart_taco
  split: train
  stat_dict_path: /result/uhnam/dexcore/bimart_taco/assets/taco_motion_norm_stats_fps.pkl
  action_dim: 1200
  pred_horizon: 64
  global_state_dim: 8
  base_frame: 8
  end_frame: null
  hand_keypoints: 100
  hand_index_path: /home/uhnam/workspace/dexcore/third_party/BimArt/assets/part_fps_hand_index_100.npy
  num_workers: 8
  bps_feature_dim: 3
  num_bps_points: 512
model:
  diffusion_step_embed_dim: 256
  null_bps_token_dim: 128
  null_contact_token_dim: 128
  beta: squaredcos_cap_v2
  noise_scheduler: ddpm
  ff_size: 1024
  num_layers: 8
  num_heads: 4
  dropout: 0.1
  activation: gelu
  latent_cond_dim: 512
train:
  num_diffusion_iters: 50
  start_epochs: 0
  num_epochs: 60
  warmup_steps: 100
  load_pretrained: false
  pretrain_model_name: model_final.pth
  train_batch_size: 100
  save_checkpt_epoch: 100
  contact_on_prob: 0.5
  lr: 1.0e-4
  use_wandb: true
  wandb_pj_name: bimart_taco_motion
  wandb_entity: enter_your_credential
test:
  eval: true
  eval_batch_size: 1
  n_sample: 3
  save_output: false
  split: test_2      # tool meshes held out -- the transfer question
viz:
  viz_prefix: ""
  fit_mano: true
  fit_mano_steps: 4000
  norm_high: 0.15
