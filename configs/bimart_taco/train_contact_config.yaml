# TACO port of BimArt's contact model config.
# Changed from the ARCTIC original: data paths, `global_state_dim` 7 -> 8 (two objects means two
# scales), `base_frame` 100 -> 8 (TACO has no T-pose lead-in and a median length of 148 frames).
inherit: null
exp_name: contact_model_taco
# data and loading
base_dir: /result/uhnam/dexcore/taco/10_bimart_gen1_original_label
split: train
end_frame: null
base_frame: 8
batch_size: 100
num_workers: 8
normalize_data: true
pred_horizon: 64
num_features: 3
num_bps_points: 512
global_state_dim: 8
stat_dict_path: /result/uhnam/dexcore/taco/10_bimart_gen1_original_label/assets/taco_contact_norm_stats.pkl
# architecture -- unchanged from upstream
ff_size: 1024
activation: gelu
dropout: 0.1
latent_cond_dim: 512
mlp_layer1_dim: 1024
mlp_layer2_dim: 1024
num_heads: 4
num_layers: 8
obj_latent_dim: 1024
# training -- unchanged from upstream
load_pretrained: false
lr: 1.0e-05
start_epochs: 0
num_epochs: 200
num_timesteps: 50
pretrained_model_path: null
# output
save_root_dir: /result/uhnam/dexcore/taco/10_bimart_gen1_original_label/experiments/
save_checkpt_epoch: 100
use_wandb: true
wandb_entity: enter_your_credential
wandb_pj_name: bimart_taco_contact
